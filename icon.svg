<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="512" height="512">
  <!-- Фон в стиле Тёмной Академии -->
  <rect width="512" height="512" rx="100" fill="#4a3a2e"/>
  <!-- Тонкая стильная рамка -->
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="#f7f3ea" stroke-width="4" opacity="0.4"/>
  
  <!-- Иконка Книги и Академической шапки (упрощенная для читаемости) -->
  <g fill="#f7f3ea" transform="translate(128, 80) scale(0.5)">
    <!-- Академическая шапка -->
    <polygon points="256,32 480,128 256,224 32,128"/>
    <polygon points="128,166 128,320 256,384 384,320 384,166 256,240"/>
    <path d="M416,140 v80 c0,10 10,20 20,20 s20-10 20-20 v-80 Z"/>
    <!-- Открытая книга -->
    <path d="M64,352 C160,320 240,384 256,416 C272,384 352,320 448,352 V128 C352,96 272,160 256,192 C240,160 160,96 64,128 Z" opacity="0.9"/>
  </g>

  <!-- Красивый читаемый текст -->
  <text x="256" y="360" font-family="Arial, sans-serif" font-weight="bold" font-size="42" fill="#f7f3ea" text-anchor="middle" letter-spacing="2">ПОРТФОЛИО</text>
  <text x="256" y="420" font-family="Arial, sans-serif" font-weight="bold" font-size="34" fill="#d4af37" text-anchor="middle" letter-spacing="1">СКО и ПТ</text>
</svg>
